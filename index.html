<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline' https://unpkg.com; style-src 'self' 'unsafe-inline'; connect-src 'self' wss://test.mosquitto.org:8081; media-src 'self' blob: mediastream:; img-src 'self' blob: data:;">
    <meta name="referrer" content="no-referrer">
    <title>Haven · Shared World</title>
    <link rel="stylesheet" href="style.css">
    <script type="importmap">
        {
            "imports": {
                "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
                "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
            }
        }
    </script>
</head>
<body>
    <div id="hud-panel">
        <div id="player-name-display">Player</div>
        <div class="hud-bars">
            <div class="bar-container">
                <div class="health-bar-fill"></div>
            </div>
            <div class="bar-container">
                <div class="armor-bar-fill"></div>
            </div>
        </div>
        <button id="mic-toggle" style="display:none;" title="Toggle Microphone (M)">
            <svg id="mic-icon-on" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 1a3 3 0 0 0-3 3v8a3 3 0 0 0 6 0V4a3 3 0 0 0-3-3z"/><path d="M19 10v2a7 7 0 0 1-14 0v-2"/><line x1="12" y1="19" x2="12" y2="23"/><line x1="8" y1="23" x2="16" y2="23"/></svg>
            <svg id="mic-icon-off" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="display:none;"><line x1="1" y1="1" x2="23" y2="23"/><path d="M9 9v3a3 3 0 0 0 5.12 2.12M15 9.34V4a3 3 0 0 0-5.94-.6"/><path d="M17 16.95A7 7 0 0 1 5 12v-2m14 0v2c0 .76-.13 1.49-.35 2.17"/><line x1="12" y1="19" x2="12" y2="23"/><line x1="8" y1="23" x2="16" y2="23"/></svg>
        </button>
    </div>
    <div id="loader">
        <div class="loader-card">
            <h1 class="loader-title">Haven</h1>
            <div id="loader-text">Initializing 3D Environment...</div>
            <div class="progress-bar-bg">
                <div id="progress-bar-fill"></div>
            </div>
            <div id="loader-percentage">0%</div>
        </div>
    </div>
    <canvas id="minimap" aria-label="World map and player position"></canvas>
    <div id="minimap-hint">N ↑ · Town square &amp; woodland</div>
    <div id="instructions">WASD &bull; Shift+W run &bull; Space jump &bull; M mute</div>
    
    <div id="name-modal">
        <div class="name-card">
            <h2>Welcome to Haven</h2>
            <p>Enter your player name to begin</p>
            <input type="text" id="player-name-input" placeholder="Player Name" maxlength="15" autocomplete="off">
            <button id="join-btn">Join World</button>
        </div>
    </div>

    <script src="https://unpkg.com/mqtt/dist/mqtt.min.js"></script>
    <script src="https://unpkg.com/simple-peer@9.11.1/simplepeer.min.js"></script>
    <script type="module" src="main.js"></script>
</body>
</html>
