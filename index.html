<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Haven · Shared World</title>
    <link rel="stylesheet" href="style.css">
    <script type="importmap">
        {
            "imports": {
                "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
                "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
            }
        }
    </script>
</head>
<body>
    <div id="world-panel">
        <strong>HAVEN · SHARED WORLD</strong>
        <span id="world-id"></span>
        <span id="world-location">Town square</span>
        <span>Fixed world · Local play</span>
    </div>
    <div id="loader">
        <div class="loader-card">
            <h1 class="loader-title">Haven</h1>
            <div id="loader-text">Initializing 3D Environment...</div>
            <div class="progress-bar-bg">
                <div id="progress-bar-fill"></div>
            </div>
            <div id="loader-percentage">0%</div>
        </div>
    </div>
    <canvas id="minimap" aria-label="World map and player position"></canvas>
    <div id="minimap-hint">N ↑ · Town square &amp; woodland</div>
    <div id="instructions">WASD &bull; Shift+W run &bull; Space jump</div>
    <script type="module" src="main.js"></script>
</body>
</html>
