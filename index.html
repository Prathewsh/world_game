<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' https://unpkg.com; style-src 'self' 'unsafe-inline'; connect-src wss://test.mosquitto.org:8081 stun:stun.l.google.com:19302 stun:stun1.l.google.com:19302 stun:stun2.l.google.com:19302; media-src 'self' blob: mediastream:; img-src 'self' blob: data:;">
    <meta name="referrer" content="no-referrer">
    <title>Haven · Shared World</title>
    <link rel="stylesheet" href="style.css">
    <script type="importmap">
        {
            "imports": {
                "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
                "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
            }
        }
    </script>
</head>
<body>
    <div id="hud-panel">
        <div id="player-name-display">Player</div>
        <div class="hud-bars">
            <div class="bar-container">
                <div class="health-bar-fill"></div>
            </div>
            <div class="bar-container">
                <div class="armor-bar-fill"></div>
            </div>
        </div>
    </div>
    <div id="loader">
        <div class="loader-card">
            <h1 class="loader-title">Haven</h1>
            <div id="loader-text">Initializing 3D Environment...</div>
            <div class="progress-bar-bg">
                <div id="progress-bar-fill"></div>
            </div>
            <div id="loader-percentage">0%</div>
        </div>
    </div>
    <canvas id="minimap" aria-label="World map and player position"></canvas>
    <div id="minimap-hint">N ↑ · Town square &amp; woodland</div>
    <div id="instructions">WASD &bull; Shift+W run &bull; Space jump</div>
    
    <div id="name-modal">
        <div class="name-card">
            <h2>Welcome to Haven</h2>
            <p>Enter your player name to begin</p>
            <input type="text" id="player-name-input" placeholder="Player Name" maxlength="15" autocomplete="off">
            <button id="join-btn">Join World</button>
        </div>
    </div>

    <script src="https://unpkg.com/mqtt/dist/mqtt.min.js"></script>
    <script src="https://unpkg.com/simple-peer@9.11.1/simplepeer.min.js"></script>
    <script type="module" src="main.js"></script>
</body>
</html>
